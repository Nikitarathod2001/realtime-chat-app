services:
  backend:
    build: ./server
    container_name: chat-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env

  frontend:
    build: 
      context: ./client
      args:
        VITE_URL: http://localhost:5000
    container_name: chat-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        env:
          VITE_URL: http://localhost:5000
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t realtime-chat-backend ./server

      - name: Build frontend Docker image
        run: docker build --build-arg VITE_URL=http://localhost:5000 -t realtime-chat-frontend ./client
services:
  backend:
    build: ./server
    container_name: chat-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env

  frontend:
    build:
      context: ./client
      args:
        VITE_URL: http://54.87.37.174
    container_name: chat-frontend
    ports:
      - "80:80"
    depends_on:
      - backend